esphome:
  name: esp32-c3-nat
  friendly_name: esp32-c3-nat

esp32:
  board: esp32-c3-devkitm-1
  cpu_frequency: 160MHZ
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: ""
  
ota:
  - platform: esphome
    password: ""

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# --- This is where you configure your NAT AP component! ---
nat_ap:
  ap_ssid: "MiAP_ESPHome"
  ap_password: "MiContrasenaSegura"
  ap_ip_address: "192.168.20.1" # For example, a new subnet
  hide_ssid: false

  port_forwarding:
    # Redirect external TCP port 8080 to internal IP 192.168.20.10, port 80
    - protocol: TCP
      external_port: 8080
      internal_ip: "192.168.20.10"
      internal_port: 80
    
    # Redirect external UDP port 12345 to internal IP 192.168.20.20, port 54321
    - protocol: UDP
      external_port: 12345
      internal_ip: "192.168.20.20"
      internal_port: 54321

    # Redirect both TCP and UDP from external port 5000 to internal IP 192.168.20.30, port 5000
    - protocol: TCP_UDP
      external_port: 5000
      internal_ip: "192.168.20.30"
      internal_port: 5000
